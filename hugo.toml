title = "Blog OSCPC"
baseURL = "https://osucpc2026.github.io/blog/"
languageCode = "ja"
# 未設定だと en 扱いになり、画面の文言が英語になる
defaultContentLanguage = "ja"
timeZone = "Asia/Tokyo"
timeout = "5m"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

# 検索は /index.json を読む。outputs はテーマから引き継がれないのでここに書く
[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[params]
  description = "非公認サークルの 大阪産業大学 競プロサークル のブログです"
  author = "osucpc2026"
  footer = "© 2026 osucpc2026"

# 管理画面（hugo-gh-admin）。記事もサイト設定もこのリポジトリに保存する
[params.ghAdmin]
  lang = "ja"
  repo = "osucpc2026/blog"
  branch = "main"
  siteRepo = "osucpc2026/blog"
  siteBranch = "main"
  siteConfigPath = "hugo.toml"

# テーマ（Blogit）。default / warm / cool から選べる
[[module.imports]]
  path = "github.com/kmmz532/blogit/themes/cool"
